name: Discovery and Salesforce validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt ruff==0.13.3
      - name: Check changed runtime code
        run: python -m ruff check run.py app/main.py app/procedure_catalog.py app/intermediate_representation.py app/canonical_entities.py app/canonical_evidence.py app/contract_classification.py app/business_discovery.py app/ir_salesforce_bridge.py app/salesforce.py app/mim_incidents.py app/mim_network_context.py app/seeded_network_import.py scripts/seeded_network_sf.py app/discovery_inventory.py app/terraform_inventory.py app/salesforce_browser.py app/canonical_project_api.py scripts/package_submission.py --select E4,E7,E9,F
      - run: python -m compileall -q app scripts run.py
      - name: Install Lightning compiler for metadata checks
        run: npm install --prefix /tmp/lifeaftercode-lwc --no-save --ignore-scripts @lwc/compiler@9.5.2
      - name: Compile Salesforce workspace templates
        run: node scripts/check_salesforce_workspace.cjs /tmp/lifeaftercode-lwc/node_modules/@lwc/compiler
      - run: python -m pytest -q
      - name: Build focused submission
        run: python scripts/package_submission.py
      - name: Check isolated submission
        run: |
          python -m zipfile -e dist/lifeaftercode-submission.zip /tmp/submission
          cd /tmp/submission
          python -m pytest -q

